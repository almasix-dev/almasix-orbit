[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almasix-orbit"
version = "0.5.0"
description = "Orbit panels — Filament's power for Almasix"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Almasix Contributors" }]
dependencies = [
    "almasix>=0.6.0",
    "almasix-conduit>=0.2.0",
    "almasix-permission>=0.1.0",
    "almasix-orbit-support>=0.1.0",
    "almasix-orbit-schemas>=0.1.0",
    "almasix-orbit-forms>=0.1.0",
    "almasix-orbit-tables>=0.1.0",
    "almasix-orbit-actions>=0.1.0",
    "almasix-orbit-infolists>=0.1.0",
    "almasix-orbit-notifications>=0.1.0",
    "almasix-orbit-widgets>=0.1.0",
    "almasix-orbit-query-builder>=0.1.0",
]

[project.entry-points."almasix.providers"]
orbit = "almasix.orbit.provider:OrbitServiceProvider"

[project.urls]
Homepage = "https://github.com/almasix-dev/almasix-orbit"
Documentation = "https://orbit.almasix.com/"
Repository = "https://github.com/almasix-dev/almasix-orbit"

[tool.hatch.build.targets.wheel]
packages = ["src/almasix"]
