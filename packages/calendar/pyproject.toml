[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almasix-orbit-calendar"
version = "0.1.0"
description = "Orbit schedule view. Wraps CalendarJS in Alpine so a panel can show day and week events."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Almasix Contributors" }]
dependencies = [
    "almasix-orbit-panels>=0.4.3",
]

[project.urls]
Homepage = "https://github.com/almasix-dev/almasix-orbit"
Documentation = "https://orbit.almasix.com/"
Repository = "https://github.com/almasix-dev/almasix-orbit"

[tool.hatch.build.targets.wheel]
packages = ["src/almasix"]
