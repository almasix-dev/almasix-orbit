name: Orbit Branding
slug: orbit-branding
summary: Sample panel plugin that sets a favicon and injects a boot-time render hook.
description: |
  ## What it does

  `BrandingPlugin` is the official sample of an Orbit `Plugin` subclass. It lives
  in the orbit-admin example app and shows the `register` / `boot` split:

  - **`register`** sets a favicon on the panel when one is not already configured.
  - **`boot`** injects an HTML comment after panel styles through a scoped render hook.

  Copy it when you start a published plugin of your own. It is not a PyPI package —
  clone the Orbit repository and import it from `examples/orbit-admin`.

  ## Wire it up

  ```python
  from app.orbit.app.plugins import BrandingPlugin

  panel.plugin(BrandingPlugin())
  ```

  Full walkthrough: [Plugin development](https://orbit.almasix.com/panels/plugins/).
