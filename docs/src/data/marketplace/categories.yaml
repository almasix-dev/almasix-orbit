# Allowed marketplace categories. Keys are the values used in a plugin's
# `categories:` list. Adding a category is a maintainer decision — open an
# issue before submitting a plugin that needs a new one.

form-field:
  label: Form field
  description: New input types for schemas and forms.

form-layout:
  label: Form layout
  description: Layout components that arrange fields on a page.

table-column:
  label: Table column
  description: New column types for tables.

table-filter:
  label: Table filter
  description: Filters, filter UIs, and saved views for tables.

infolist-entry:
  label: Infolist entry
  description: New read-only entry types for infolists.

action:
  label: Action
  description: Row, bulk, header, or page actions and modal flows.

widget:
  label: Widget
  description: Dashboard widgets — stats, charts, tables, custom HTML.

theme:
  label: Theme
  description: Panel themes, color systems, and CSS layers.

panel-kit:
  label: Panel kit
  description: Whole feature sets — blog, CRM, user management, settings.

authentication:
  label: Authentication
  description: Login, registration, MFA providers, and permissions.

integration:
  label: Integration
  description: Bridges to third-party services and APIs.

localization:
  label: Localization
  description: Translations and locale-aware behavior.

developer-tool:
  label: Developer tool
  description: Debugging, scaffolding, and build-time helpers.
