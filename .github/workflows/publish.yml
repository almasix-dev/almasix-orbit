name: Publish

# Trusted Publishing (OIDC) for every Orbit package on PyPI / TestPyPI.
# See PUBLISHING.md for pending-publisher setup (one row per package).
#
# Cutting a release:    GitHub Release on a vX.Y.Z tag (all packages share that version).
# Rehearsing:           Actions → Publish → Run workflow → target: testpypi.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

env:
  # Publish order: leaves first, meta package last.
  ORBIT_PACKAGES: >-
    support
    schemas
    forms
    actions
    tables
    infolists
    notifications
    widgets
    query-builder
    panels

jobs:
  build:
    name: Build all wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag must match packaged versions
        if: github.event_name == 'release'
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          for pkg in support schemas forms actions tables infolists notifications widgets query-builder panels; do
            ver=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('packages/$pkg/pyproject.toml').read_text())['project']['version'])")
            echo "$pkg=$ver"
            if [ "$ver" != "$tagged" ]; then
              echo "::error::$pkg version $ver does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - name: Build sdist + wheel for each package
        run: |
          pip install build twine
          mkdir -p dist-all
          for pkg in support schemas forms actions tables infolists notifications widgets query-builder panels; do
            rm -rf "packages/$pkg/dist"
            python -m build "packages/$pkg"
            twine check --strict "packages/$pkg/dist"/*
            cp "packages/$pkg/dist"/* dist-all/
          done
          ls -la dist-all
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist-all/

  verify:
    name: Install meta wheel
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install dependency order then meta
        run: |
          # Local wheels satisfy inter-package deps during verify.
          pip install dist/almasix_orbit_support-*.whl
          pip install dist/almasix_orbit_schemas-*.whl
          pip install dist/almasix_orbit_forms-*.whl
          pip install dist/almasix_orbit_actions-*.whl
          pip install dist/almasix_orbit_tables-*.whl
          pip install dist/almasix_orbit_infolists-*.whl
          pip install dist/almasix_orbit_notifications-*.whl
          pip install dist/almasix_orbit_widgets-*.whl
          pip install dist/almasix_orbit_query_builder-*.whl
          # Meta may still want almasix/conduit/permission from PyPI.
          pip install dist/almasix_orbit-*.whl || pip install --no-deps dist/almasix_orbit-*.whl
      - name: Import
        run: |
          python - <<'PY'
          from almasix.orbit import Panel, Resource
          from almasix.orbit.forms import TextInput, Form
          from almasix.orbit.tables import Table, TextColumn
          assert TextInput.make("name").get_name() == "name"
          print("almasix.orbit: ok")
          PY

  testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/almasix-orbit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/almasix-orbit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
