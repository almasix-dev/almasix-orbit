name: Publish

# Trusted Publishing (OIDC).
#
# With reusable/called workflows, GitHub attestations use the CALLER workflow
# filename in Build Config URI. So every PyPI Trusted Publisher must register:
#   Workflow name: publish.yml
#   Environment:   unique per package (see PUBLISHING.md)
#
# Do NOT register publish-almasix-orbit-*.yml — those are not what OIDC attests.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build all wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag must match packaged versions
        if: github.event_name == 'release'
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          for pkg in support schemas forms actions tables infolists notifications widgets query-builder panels; do
            ver=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('packages/$pkg/pyproject.toml').read_text())['project']['version'])")
            echo "$pkg=$ver"
            if [ "$ver" != "$tagged" ]; then
              echo "::error::$pkg version $ver does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - name: Build
        run: |
          pip install build twine
          mkdir -p dist-all
          for pkg in support schemas forms actions tables infolists notifications widgets query-builder panels; do
            rm -rf "packages/$pkg/dist"
            python -m build "packages/$pkg"
            twine check --strict "packages/$pkg/dist"/*
            cp "packages/$pkg/dist"/* dist-all/
          done
          ls -la dist-all
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist-all/

  verify:
    name: Install wheels
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: |
          pip install dist/almasix_orbit_support-*.whl
          pip install dist/almasix_orbit_schemas-*.whl
          pip install dist/almasix_orbit_forms-*.whl
          pip install dist/almasix_orbit_actions-*.whl
          pip install dist/almasix_orbit_tables-*.whl
          pip install dist/almasix_orbit_infolists-*.whl
          pip install dist/almasix_orbit_notifications-*.whl
          pip install dist/almasix_orbit_widgets-*.whl
          pip install dist/almasix_orbit_query_builder-*.whl
          pip install dist/almasix_orbit-*.whl || pip install --no-deps dist/almasix_orbit-*.whl
          python -c "from almasix.orbit.forms import TextInput; assert TextInput.make('n').get_name()=='n'"

  # Unique GitHub Environment per package → unique Trusted Publisher identity
  # while workflow filename stays publish.yml (what attestations record).

  publish:
    name: PyPI ${{ matrix.pypi_name }}
    needs: [build, verify]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Meta package last via separate job with needs — matrix is unordered.
      matrix:
        include:
          - pypi_name: almasix-orbit-support
            env_suffix: almasix-orbit-support
            glob: almasix_orbit_support-*
            meta_only: "false"
          - pypi_name: almasix-orbit-schemas
            env_suffix: almasix-orbit-schemas
            glob: almasix_orbit_schemas-*
            meta_only: "false"
          - pypi_name: almasix-orbit-forms
            env_suffix: almasix-orbit-forms
            glob: almasix_orbit_forms-*
            meta_only: "false"
          - pypi_name: almasix-orbit-actions
            env_suffix: almasix-orbit-actions
            glob: almasix_orbit_actions-*
            meta_only: "false"
          - pypi_name: almasix-orbit-tables
            env_suffix: almasix-orbit-tables
            glob: almasix_orbit_tables-*
            meta_only: "false"
          - pypi_name: almasix-orbit-infolists
            env_suffix: almasix-orbit-infolists
            glob: almasix_orbit_infolists-*
            meta_only: "false"
          - pypi_name: almasix-orbit-notifications
            env_suffix: almasix-orbit-notifications
            glob: almasix_orbit_notifications-*
            meta_only: "false"
          - pypi_name: almasix-orbit-widgets
            env_suffix: almasix-orbit-widgets
            glob: almasix_orbit_widgets-*
            meta_only: "false"
          - pypi_name: almasix-orbit-query-builder
            env_suffix: almasix-orbit-query-builder
            glob: almasix_orbit_query_builder-*
            meta_only: "false"
    environment:
      name: ${{ (github.event_name == 'release' || inputs.target == 'pypi') && format('pypi-{0}', matrix.env_suffix) || format('testpypi-{0}', matrix.env_suffix) }}
      url: ${{ (github.event_name == 'release' || inputs.target == 'pypi') && format('https://pypi.org/project/{0}/', matrix.pypi_name) || format('https://test.pypi.org/project/{0}/', matrix.pypi_name) }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Stage package
        run: |
          mkdir -p upload
          cp dist/${{ matrix.glob }} upload/
          ls -la upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          repository-url: ${{ (github.event_name == 'release' || inputs.target == 'pypi') && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          skip-existing: true

  publish-meta:
    name: PyPI almasix-orbit
    needs: [build, verify, publish]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'release' || inputs.target == 'pypi') && 'pypi-almasix-orbit' || 'testpypi-almasix-orbit' }}
      url: ${{ (github.event_name == 'release' || inputs.target == 'pypi') && 'https://pypi.org/project/almasix-orbit/' || 'https://test.pypi.org/project/almasix-orbit/' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Stage meta package only
        run: |
          mkdir -p upload
          shopt -s nullglob
          for f in dist/almasix_orbit-*; do
            base=$(basename "$f")
            case "$base" in
              almasix_orbit_*) ;;
              *) cp "$f" upload/ ;;
            esac
          done
          ls -la upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          repository-url: ${{ (github.event_name == 'release' || inputs.target == 'pypi') && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          skip-existing: true
