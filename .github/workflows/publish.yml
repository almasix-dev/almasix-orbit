name: Publish

# Builds once, then calls a UNIQUE workflow file per package so each PyPI
# Trusted Publisher has a distinct (owner, repo, workflow) identity.
# See PUBLISHING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/publish-build.yml

  support:
    needs: build
    uses: ./.github/workflows/publish-almasix-orbit-support.yml
    with:
      target: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write
      contents: read

  schemas:
    needs: build
    uses: ./.github/workflows/publish-almasix-orbit-schemas.yml
    with:
      target: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write
      contents: read

  forms:
    needs: build
    uses: ./.github/workflows/publish-almasix-orbit-forms.yml
    with:
      target: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write
      contents: read

  actions:
    needs: build
    uses: ./.github/workflows/publish-almasix-orbit-actions.yml
    with:
      target: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write
      contents: read

  tables:
    needs: build
    uses: ./.github/workflows/publish-almasix-orbit-tables.yml
    with:
      target: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write
      contents: read

  infolists:
    needs: build
    uses: ./.github/workflows/publish-almasix-orbit-infolists.yml
    with:
      target: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write
      contents: read

  notifications:
    needs: build
    uses: ./.github/workflows/publish-almasix-orbit-notifications.yml
    with:
      target: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write
      contents: read

  widgets:
    needs: build
    uses: ./.github/workflows/publish-almasix-orbit-widgets.yml
    with:
      target: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write
      contents: read

  query-builder:
    needs: build
    uses: ./.github/workflows/publish-almasix-orbit-query-builder.yml
    with:
      target: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write
      contents: read

  # Meta last — depends on children already on the index for resolve, but we
  # publish wheels independently; order still helps TestPyPI installs.
  orbit:
    needs:
      - build
      - support
      - schemas
      - forms
      - actions
      - tables
      - infolists
      - notifications
      - widgets
      - query-builder
    uses: ./.github/workflows/publish-almasix-orbit.yml
    with:
      target: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write
      contents: read
