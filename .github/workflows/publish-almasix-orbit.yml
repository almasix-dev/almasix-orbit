name: Publish almasix-orbit

# Trusted Publishing identity for this file:
#   Owner: almasix-dev | Repo: almasix-orbit | Workflow: publish-almasix-orbit.yml
# Register pending publishers with Environment `pypi` / `testpypi` (see PUBLISHING.md).

on:
  workflow_call:
    inputs:
      target:
        description: pypi or testpypi
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Upload almasix-orbit
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target == 'testpypi' && 'testpypi' || 'pypi' }}
      url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/project/almasix-orbit/' || 'https://pypi.org/project/almasix-orbit/' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Stage this package only
        run: |
          mkdir -p upload
          # Meta package only (exclude almasix_orbit_* children)
          shopt -s nullglob
          for f in dist/almasix_orbit-*; do
            base=$(basename "$f")
            case "$base" in
              almasix_orbit_*) ;;
              *) cp "$f" upload/ ;;
            esac
          done
          ls -la upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true
