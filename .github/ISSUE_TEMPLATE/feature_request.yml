name: Feature request
description: Propose a concrete feature or API change you want implemented.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer a **specific** ask (API shape, Filament parity surface, UX). For early brainstorming, use **Suggestion / idea** instead. For large design work, use **RFC**.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the feature
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain or gap does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Ideal API, UX, or behavior. Pseudocode welcome.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: filament
    attributes:
      label: Filament parity?
      options:
        - "Yes — matches a Filament 5 API / docs page"
        - "Partial — inspired by Filament"
        - "No — Orbit-specific"
        - "Unsure"
    validations:
      required: false

  - type: input
    id: filament-link
    attributes:
      label: Filament / docs reference
      description: URL if this tracks Filament parity
      placeholder: https://filamentphp.com/docs/…
    validations:
      required: false
