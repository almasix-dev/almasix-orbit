name: Marketplace category
description: Propose a new plugin marketplace category
title: "[marketplace] New category: "
labels: ["marketplace"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why a new category?
      description: Existing keys live in docs/src/data/marketplace/categories.yaml. Explain what does not fit.
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: Proposed slug
      placeholder: panel-kit
    validations:
      required: true
  - type: input
    id: label
    attributes:
      label: Proposed label
      placeholder: Panel kit
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Proposed description
      description: One or two sentences shown on the category page.
      placeholder: Whole feature sets — blog, CRM, user management, settings.
    validations:
      required: true
