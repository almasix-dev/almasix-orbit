[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbit-demo"
version = "0.1.0"
description = "Orbit Records music catalog demo (Render + SQLite)"
requires-python = ">=3.11"
dependencies = [
    # Production PyPI releases only — no path / editable pins.
    "almasix[conduit]>=0.9.4",
    "almasix-orbit>=0.4.4",
    "almasix-conduit>=0.2.1",
]

[project.scripts]
smith = "almasix.smith.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]
