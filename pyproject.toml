[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almasix-orbit-workspace"
version = "0.1.0"
description = "Orbit monorepo workspace — use almasix-orbit for installs"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{ name = "Almasix Contributors" }]
dependencies = [
    "almasix-orbit",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "ruff==0.16.6",
]

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/combined"]

[tool.uv.sources]
almasix-orbit = { workspace = true }
almasix-orbit-support = { workspace = true }
almasix-orbit-schemas = { workspace = true }
almasix-orbit-forms = { workspace = true }
almasix-orbit-tables = { workspace = true }
almasix-orbit-actions = { workspace = true }
almasix-orbit-infolists = { workspace = true }
almasix-orbit-notifications = { workspace = true }
almasix-orbit-widgets = { workspace = true }
almasix-orbit-query-builder = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages"]
pythonpath = [
    "packages/support/src",
    "packages/schemas/src",
    "packages/forms/src",
    "packages/tables/src",
    "packages/actions/src",
    "packages/infolists/src",
    "packages/notifications/src",
    "packages/widgets/src",
    "packages/query-builder/src",
    "packages/panels/src",
]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = [
    "almasix.orbit",
]
omit = [
    "*/tests/*",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "@overload",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
